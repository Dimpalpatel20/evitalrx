<mat-card class="place-order-card mat-elevation-z4">
  <form [formGroup]="placeOrderForm" (ngSubmit)="submitOrder(placeOrderForm)">
    <div class="info mb-3">
      <strong>Delivery Type:</strong>
      <span class="delivery-type">{{ deliverytype | titlecase }}</span>
    </div>

    <div *ngIf="deliverytype === 'delivery'" class="address-grid">
      <mat-form-field appearance="outline">
        <mat-label>Address</mat-label>
        <input matInput formControlName="address" />
        <mat-error *ngIf="placeOrderForm.get('address')?.hasError('required')">
          Address is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Address Line 2</mat-label>
        <input matInput formControlName="address_line2" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>City</mat-label>
        <input matInput formControlName="city" />
        <mat-error *ngIf="placeOrderForm.get('city')?.hasError('required')">
          City is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>State</mat-label>
        <input matInput formControlName="state" />
        <mat-error *ngIf="placeOrderForm.get('state')?.hasError('required')">
          State is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="actions">
      <button mat-raised-button color="primary" type="submit">
        Place Order
      </button>
    </div>
  </form>
</mat-card>
