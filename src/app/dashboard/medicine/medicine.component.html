<div class="container mt-4">
  <div class="input-group mb-3">
   
    <input
      type="text"
      class="form-control"
      placeholder="Search medicines..."
      [(ngModel)]="searchTerm"
      (keyup.enter)="onSearch()"
    />
    <button class="btn btn-primary" (click)="onSearch()">Search</button>
  </div>
  <!-- Loader -->
  <div *ngIf="loading" class="text-center my-4">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
  <div *ngIf="!loading && hasSearched && medicines.length === 0">
    <p>No results found.</p>
  </div>
</div>
<div *ngIf="medicines && medicines.length">
  <table mat-table [dataSource]="medicines" class="mat-elevation-z8">
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox
          (change)="toggleAllSelection($event)"
          [checked]="isAllSelected()"
        >
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let element">
        <mat-checkbox
          (change)="toggleSelection(element)"
          [checked]="isSelected(element)"
        >
        </mat-checkbox>
      </td>
    </ng-container>
    <!-- <ng-container matColumnDef="image">
      <th mat-header-cell *matHeaderCellDef>Image</th>
      <td mat-cell *matCellDef="let element">
        <img
          [src]="element.thumb_image || element.image"
          alt="{{ element.medicine_name }}"
          style="max-height: 50px; max-width: 50px; object-fit: contain;"
          class="medicine-thumbnail"
        />
      </td>
    </ng-container> -->

    <ng-container matColumnDef="medicine_name">
      <th mat-header-cell *matHeaderCellDef>Medicine Name</th>
      <td mat-cell *matCellDef="let element">{{ element.medicine_name }}</td>
    </ng-container>

    <ng-container matColumnDef="pack_size">
      <th mat-header-cell *matHeaderCellDef>Packing size</th>
      <td mat-cell *matCellDef="let element">{{ element.packing_size }}</td>
    </ng-container>
    <ng-container matColumnDef="medicine_name_suggest">
      <th mat-header-cell *matHeaderCellDef>Suggested Medicine</th>
      <td mat-cell *matCellDef="let element">
        {{ element.medicine_name_suggest }}
      </td>
    </ng-container>
     <ng-container matColumnDef="mrp">
      <th mat-header-cell *matHeaderCellDef>MRP</th>
      <td mat-cell *matCellDef="let element" class="medi-price">₹ {{ element.mrp }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

    <button mat-flat-button color="accent" (click)="addToCart()">
        Add to cart
        </button>
</div>
