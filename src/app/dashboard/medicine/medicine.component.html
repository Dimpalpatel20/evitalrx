<div class="container mt-4">
  <div class="input-group mb-3">
    <input
      type="text"
      class="form-control"
      placeholder="Search medicines..."
      [(ngModel)]="searchTerm"
      (keyup.enter)="onSearch()"
    />
    <button class="btn btn-primary" (click)="onSearch()">Search</button>
  </div>
  <!-- Loader -->
  <div *ngIf="loading" class="text-center my-4">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
  <div *ngIf="!loading && hasSearched && medicines.length === 0">
    <p>No results found.</p>
  </div>
</div>
<div *ngIf="medicines && medicines.length">
  <table mat-table [dataSource]="medicines" class="mat-elevation-z8">
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox
          (change)="toggleAllSelection($event)"
          [checked]="isAllSelected()"
        >
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let element">
        <mat-checkbox
          (change)="toggleSelection(element)"
          [checked]="isSelected(element)"
        >
        </mat-checkbox>
      </td>
    </ng-container>

    <ng-container matColumnDef="medicine_name">
      <th mat-header-cell *matHeaderCellDef>Medicine Name</th>
      <td mat-cell *matCellDef="let element">{{ element.medicine_name }}</td>
    </ng-container>

    <ng-container matColumnDef="pack_size">
      <th mat-header-cell *matHeaderCellDef>Pack size</th>
      <td mat-cell *matCellDef="let element">{{ element.pack_size }}</td>
    </ng-container>

    <ng-container matColumnDef="mrp">
      <th mat-header-cell *matHeaderCellDef>MRP</th>
      <td mat-cell *matCellDef="let element">{{ element.mrp }}</td>
    </ng-container>

    <ng-container matColumnDef="medicine_name_suggest">
      <th mat-header-cell *matHeaderCellDef>Suggested Medicine</th>
      <td mat-cell *matCellDef="let element">
        {{ element.medicine_name_suggest }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>

<section class="example-section">
  <label class="servicetype">Service Type* :</label>
  <mat-checkbox
    class="example-margin"
    *ngFor="let service of serviceTypes"
    [checked]="selectedServiceTypes.includes(service)"
    (change)="onServiceTypeChange($event, service)"
  >
    {{ service }}
  </mat-checkbox>
</section>

<button mat-stroked-button color="warn" (click)="checkServiceability()">
  Check Serviceability
</button>
<mat-card class="mat-elevation-z4 mb-4">
  <div class="mt-3">
    <label class="mb-2 d-block fw-bold">Select Delivery Type:</label>
    <mat-radio-group
      [(ngModel)]="deliveryType"
      aria-label="Select delivery type"
    >
      <mat-radio-button value="pickup" class="me-4">Pickup</mat-radio-button>
      <mat-radio-button value="delivery">Delivery</mat-radio-button>
    </mat-radio-group>
  </div>
</mat-card>
<button mat-stroked-button color="warn" (click)="moveToCheckout()">
  Checkout
</button>
